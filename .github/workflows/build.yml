name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rename game file to main.py
        run: |
          cp "main (2).py" main.py || cp *.py main.py
      - uses: ArtemSBulgakov/buildozer-action@v1.5.0
        with:
          command: buildozer android debug
          buildozer_version: stable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code-Inflation-RPG-APK
          path: bin/*.apk
